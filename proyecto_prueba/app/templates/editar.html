<!DOCTYPE html>
<html lang="es" translate="no">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://1/cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <title>Editar Producto</title>
</head>
<body>
    <main class="container vh-100 d-flex flex-column align-items-center justify-content-center">
        <div>
            <h1>Editar Producto</h1>
            <a class="text-decoration-none btn btn-success mt-4 mb-3 align-self-center" href="{% url 'crear' %}">Registrar Producto</a>
            <a class="text-decoration-none btn btn-secondary mt-4 mb-3 align-self-center" href="{% url 'listar' %}">Ver Produtos</a>
            <form class="p-4 rounded-3 shadow" method="post">
                {% csrf_token %}
                <div class="row display-flex">
                    <div class="col-6 mb-3">
                        <div><label class="form-label fw-bold" for="nombre">Nombre:</label></div>
                        <div><input class="form-control" type="text" name="nombre" value="{{ producto.nombre }}" maxlength="100" required></div>
                    </div>
                    <div class="col-6 mb-3">
                        <div><label class="form-label fw-bold mb-0" for="precio">Precio:</label></div>
                        <div><input class="form-control" type="number" step="0.01" min="0" max="99999999.99" name="precio" value="{{ producto.precio }}" required></div>
                    </div>
                    <div class="col-6 mb-3">
                        <div><label class="form-label fw-bold" for="descripcion">Descripción:</label></div>
                        <div><textarea class="form-control" name="descripcion" rows="1" maxlength="250"  required>{{ producto.descripcion }}</textarea></div>
                    </div>
                    <div class="col-6 mb-3">
                        <div><label class="form-label fw-bold" for="categoria">Categoría:</label></div>
                        <div>
                            <select class="form-select" name="categoria" id="categoria" value="{{ producto.categoria }}" required>
                                <option value="">Seleccione una Categoría</option>
                                {% for categoria in categorias %}
                                    <option value="{{ categoria.id }}"
                                        {% if categoria.id == producto.categoria.id %}selected{% endif %}>
                                        {{ categoria.nombre }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Actualizar</button>
            </form>
        </div>
    </main>
</body>
</html>
