{% extends "base.html" %}

{% block title %}Registrar Producto{% endblock %}

{% block content %}
<main class="container vh-100 d-flex flex-column align-items-center justify-content-center">
    <div>
        <h1>Registrar Producto</h1>
        <a class="text-decoration-none btn btn-success mt-4 mb-3 align-self-center" href="{% url 'listar' %}">Ver Productos</a>
        <form class="p-4 rounded-3 shadow" method="post">
            {% csrf_token %}
            <div class="row display-flex">
                <div class="col-6 mb-3">
                    <div><label class="form-label fw-bold" for="nombre">Nombre:</label></div>
                    <div><input class="form-control" type="text" name="nombre" maxlength="100" required></div>
                </div>
                <div class="col-6 mb-3">
                    <div><label class="form-label fw-bold mb-0" for="precio">Precio:</label></div>
                    <div><input class="form-control" type="number" step="0.01" min="0" max="99999999.99" name="precio" required></div>
                </div>
                <div class="col-6 mb-3">
                    <div><label class="form-label fw-bold" for="descripcion">Descripción:</label></div>
                    <div><textarea class="form-control" name="descripcion" rows="1" maxlength="250" required></textarea></div>
                </div>
                <div class="col-6 mb-3">
                    <div><label class="form-label fw-bold" for="categoria">Categoría:</label></div>
                    <div>
                        <select class="form-select" name="categoria" id="categoria" required>
                            <option value="">Seleccione una Categoría</option>
                            {% for categoria in categorias %}
                                <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</main>
{% endblock %}
