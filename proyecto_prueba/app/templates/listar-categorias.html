{% extends "base.html" %}

{% block title %}Listar Categorías{% endblock %}

{% block content %}
<main class="container vh-100 d-flex align-items-center">
    <div class="w-100">
        <h1>Lista de Categorías</h1>
        <a class="text-decoration-none btn btn-success mt-4 mb-0" href="{% url 'crear-categoria' %}">Registrar Categoría</a>
        <div class="table-responsive shadow-sm rounded mt-3">
            <table class="table table-striped table-hover align-middle w-100 mt-0">
                <thead class="table-primary">
                    <th>Nombre</th>
                    <th></th>
                    <th></th>
                </thead>
                <tbody>
                    {% for categoria in categorias %}
                    <tr>
                        <td>{{ categoria.nombre }}</td>
                        <td style="width: 10%"><a class="text-decoration-none text-reset fw-semibold btn btn-warning" href="{% url 'editar-categoria' categoria.id %}">Editar</a></td>
                        <td style="width: 10%"><a class="text-decoration-none fw-semibold text-white btn btn-danger" href="{% url 'eliminar-categoria' categoria.id %}" onclick="return confirmar_eliminacion()">Eliminar</a></td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-muted">No hay categorías disponibles</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</main>
{% endblock %}
